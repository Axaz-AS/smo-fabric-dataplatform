version: 2

models:
  - name: src_nobs__statordrehistorikk
    description: "Staging view over NOBS StatOrdrehistorikk (order production status history). All KPL bracket escaping, Delta casing and type casting is quarantined here. No filtering or business rules."
    config:
      meta:
        grain: one row per order production status stage
        source_system: nobs
    columns:
      - name: pk_ordrehistorikk_id
        description: "KPL record id of the history row."
        tests: [unique, not_null]
      - name: fk_ordre_id
        description: "KPL order id the history row belongs to."
      - name: fk_medarbeider_id
        description: "KPL employee id responsible at this stage."
      - name: date_start
        description: "Start date of the production stage (KPL column Dato)."
      - name: is_deleted
        description: "KPL soft-delete flag (0 = active)."
