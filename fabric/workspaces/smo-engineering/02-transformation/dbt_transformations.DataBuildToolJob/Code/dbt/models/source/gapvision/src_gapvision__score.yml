version: 2

models:
  - name: src_gapvision__score
    description: "Staging view over lh_bronze.gapvision.V111_Score. Extracts, renames, casts and quaranines Lakehouse column escaping."
    config:
      meta:
        grain: "one row per respondent answer"
    columns:
      - name: fk_response_id
        description: "Foreign key to the survey response."
        tests:
          - not_null
      - name: score
        description: "Numerical survey score value."
