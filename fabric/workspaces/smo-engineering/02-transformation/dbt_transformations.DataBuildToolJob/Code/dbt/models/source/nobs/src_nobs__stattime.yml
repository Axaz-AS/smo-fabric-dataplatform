version: 2

models:
  - name: src_nobs__stattime
    description: "Staging view over NOBS StatTime (registered time per employee, order and date). All KPL bracket escaping, Delta casing and type casting is quarantined here. No filtering or business rules."
    config:
      meta:
        grain: one row per registered time entry in the statistics extract
        source_system: nobs
    columns:
      - name: pk_time_stat_id
        description: "KPL record id of the statistics row."
        tests: [unique, not_null]
      - name: pk_time_id
        description: "KPL id of the underlying Time registration entry."
      - name: fk_ordre_id
        description: "KPL order id the time was registered against."
      - name: fk_medarbeider_id
        description: "KPL employee id who registered the time."
      - name: entry_date
        description: "Calendar date of the time registration (KPL column Dato)."
      - name: is_deleted
        description: "KPL soft-delete flag (0 = active)."
