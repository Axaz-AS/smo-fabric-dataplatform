version: 2

models:
  - name: int_nobs__event
    description: "Active NOBS consultation/event registrations — staging data with KPL soft-deleted rows removed. Pass-through of src_nobs__statevent; no further business logic."
    config:
      meta:
        grain: one row per active event registration
        source_system: nobs
    columns:
      - name: pk_event_id
        description: "KPL record id of the event row."
        tests: [unique, not_null]
