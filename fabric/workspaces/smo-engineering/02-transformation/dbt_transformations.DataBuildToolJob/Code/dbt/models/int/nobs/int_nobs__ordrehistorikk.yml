version: 2

models:
  - name: int_nobs__ordrehistorikk
    description: "Active NOBS order production status history — staging data with KPL soft-deleted rows removed. Pass-through of src_nobs__statordrehistorikk; no further business logic."
    config:
      meta:
        grain: one row per active order production status stage
        source_system: nobs
    columns:
      - name: pk_ordrehistorikk_id
        description: "KPL record id of the history row."
        tests: [unique, not_null]
