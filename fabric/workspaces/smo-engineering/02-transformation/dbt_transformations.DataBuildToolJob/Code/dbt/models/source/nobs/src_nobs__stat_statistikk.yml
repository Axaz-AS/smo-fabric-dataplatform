version: 2

models:
  - name: src_nobs__stat_statistikk
    description: "Staging view over NOBS STAT_Statistikk (order statistics). All KPL bracket escaping, Delta casing and type casting is quarantined here; names are standardized snake_case. No filtering or business rules."
    config:
      meta:
        grain: one row per order statistics row
        source_system: nobs
    columns:
      - name: pk_statistikk_id
        description: "KPL record id of the statistics row."
        tests: [unique, not_null]
      - name: fk_ordre_id
        description: "KPL order id the statistics row describes."
      - name: fk_pasient_id
        description: "KPL patient id of the patient on the order."
      - name: fk_avdeling_id
        description: "KPL department id owning the row."
      - name: is_deleted
        description: "KPL soft-delete flag (0 = active)."
      - name: ingested_at
        description: "Bronze ingestion timestamp added by the loader."
