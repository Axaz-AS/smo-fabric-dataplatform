version: 2

models:
  - name: src_nobs__statpasient_detail
    description: "Staging view over NOBS StatPasient_detail (patient register). All KPL bracket escaping, Delta casing and type casting is quarantined here. No filtering — soft-delete and dummy-row filtering happens in int_nobs__pasient_detail."
    config:
      meta:
        grain: one row per patient register entry
        source_system: nobs
    columns:
      - name: pk_pasient_detail_id
        description: "KPL record id of the patient entry."
        tests: [unique, not_null]
      - name: fk_person_id
        description: "KPL person id of the patient."
      - name: patient_number
        description: "NOBS patient number (Pasientnr)."
      - name: is_deleted
        description: "KPL soft-delete flag; value 9 marks terminated/register-closed entries (filtered in int)."
      - name: dummy
        description: "KPL dummy marker column; non-null rows are test artifacts filtered in int."
