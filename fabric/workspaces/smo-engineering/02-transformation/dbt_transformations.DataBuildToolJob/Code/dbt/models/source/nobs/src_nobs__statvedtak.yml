version: 2

models:
  - name: src_nobs__statvedtak
    description: "Staging view over NOBS StatVedtak (NAV decisions linked to orders and persons). All KPL bracket escaping, Delta casing and type casting is quarantined here. No filtering or business rules."
    config:
      meta:
        grain: one row per vedtak-order link
        source_system: nobs
    columns:
      - name: pk_stat_vedtak_id
        description: "KPL record id of the vedtak statistics row."
        tests: [unique, not_null]
      - name: fk_vedtak_id
        description: "KPL vedtak (decision) id."
      - name: fk_ordre_id
        description: "KPL order id the decision is linked to."
      - name: fk_person_id
        description: "KPL person id the decision concerns."
      - name: is_deleted
        description: "KPL soft-delete flag (0 = active)."
