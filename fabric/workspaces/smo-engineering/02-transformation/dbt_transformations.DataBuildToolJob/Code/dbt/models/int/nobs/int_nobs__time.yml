version: 2

models:
  - name: int_nobs__time
    description: "Active NOBS registered time entries — staging data with KPL soft-deleted rows removed. Pass-through of src_nobs__stattime; no further business logic."
    config:
      meta:
        grain: one row per active registered time entry in the statistics extract
        source_system: nobs
    columns:
      - name: pk_time_stat_id
        description: "KPL record id of the statistics row."
        tests: [unique, not_null]
      - name: pk_time_id
        description: "KPL id of the underlying Time registration entry."
